name: Publish GlassDock
on:
  push:
    branches: [main]
    paths: [VERSION, downloads/GlassDock.dmg]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glassdock-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the tested disk image
        working-directory: downloads
        run: sha256sum -c GlassDock.dmg.sha256
      - name: Publish disk image and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          gh release create "v$version" downloads/GlassDock.dmg downloads/GlassDock.dmg.sha256 \
            --target "$GITHUB_SHA" --title "GlassDock $version" --notes-file RELEASE.md
