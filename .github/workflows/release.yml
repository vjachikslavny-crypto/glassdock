name: Publish GlassDock
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glassdock-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build universal disk image
        run: bash build.sh
      - name: Publish disk image and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          gh release create "v$version" build/GlassDock.dmg build/GlassDock.dmg.sha256 \
            --target "$GITHUB_SHA" --title "GlassDock $version" --notes-file RELEASE.md
